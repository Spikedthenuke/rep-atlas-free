<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rep Atlas">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./app.css?v=25">
  <title>Rep Atlas</title>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#plans" aria-label="Rep Atlas home"><span class="brand-mark">R</span><span>Rep Atlas</span></a>
    <button id="backup-button" class="icon-button" type="button" aria-label="Settings and appearance" title="Settings and appearance">⚙</button>
    <input id="restore-file" type="file" accept="application/json,.json" hidden>
  </header>
  <main id="app" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Main navigation">
    <button data-tab="plans" class="tab active"><span>▦</span>Plans</button>
    <button data-tab="library" class="tab"><span>⌕</span>Exercises</button>
    <button data-tab="log" class="tab"><span>✓</span>Log</button>
    <button data-tab="goals" class="tab"><span>◎</span>Goals</button>
  </nav>
  <div id="modal" class="modal-host" hidden></div>  <script src="./app.js?v=25" defer></script>
  <script src="./push.js/push.js" defer></script>
</body>
</html>
